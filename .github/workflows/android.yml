name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omemo-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Start isolated TLS XMPP server
        run: bash ci/start-xmpp.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test optimized APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew --no-daemon connectedRuntimeCheckAndroidTest -PRUNTIME_TEST=true --stacktrace
      - name: Verify server received encrypted payloads only
        run: |
          ! grep -q JARBOA_TEST_LEAK ci/prosody.log
          for id in ci-forward ci-reply ci-offline ci-reconnect; do
            grep -q "JARBOA_TEST_ENCRYPTED $id" ci/prosody.log
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: omemo-runtime-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/runtimeCheck/
            ci/prosody.log
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify and assemble
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify OMEMO reflection targets survive R8
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          DEX_STRINGS=$(mktemp)
          unzip -p "$APK" 'classes*.dex' | strings > "$DEX_STRINGS"
          grep -Fq 'Lorg/whispersystems/curve25519/OpportunisticCurve25519Provider;' "$DEX_STRINGS"
          grep -Fq 'Lorg/whispersystems/libsignal/protocol/SignalProtos$SignalMessage;' "$DEX_STRINGS"
          grep -Fq 'getRatchetKey' "$DEX_STRINGS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jarboa-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
