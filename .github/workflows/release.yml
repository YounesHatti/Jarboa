name: Signed release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          mkdir -p signing
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > signing/release.jks
      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: signing/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.([0-9]+))?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.NUMBER."
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          if [[ -n "${BASH_REMATCH[5]}" ]]; then
            SLOT=$((10#${BASH_REMATCH[5]}))
            if (( SLOT < 1 || SLOT > 98 )); then
              echo "Beta number must be between 1 and 98."
              exit 1
            fi
          else
            SLOT=99
          fi
          VERSION_CODE=$((MAJOR * 100000000 + MINOR * 100000 + PATCH * 100 + SLOT))
          ./gradlew --no-daemon lintRelease testDebugUnitTest assembleRelease -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" --stacktrace
          mv app/build/outputs/apk/release/app-release.apk "Jarboa-$VERSION_NAME.apk"
          sha256sum "Jarboa-$VERSION_NAME.apk" > "Jarboa-$VERSION_NAME.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=(--verify-tag --generate-notes --title "Jarboa $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" Jarboa-*.apk Jarboa-*.apk.sha256 "${RELEASE_FLAGS[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f signing/release.jks
